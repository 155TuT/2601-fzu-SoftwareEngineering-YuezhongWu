<!-- Generated by scripts/build-footer.mjs; CSS belongs in page-custom.css. -->
<script>
/* Keep the original image node (and its zoom/link behavior) inside a corner frame. */
(() => {
  'use strict';
  const images = '#cnblogs_post_body img:not(.blog-link-favicon-slot img), .postCon img';

  function wrap(image) {
    if (image.closest('.blog-image-frame, .blog-link-favicon-slot')) return;
    const frame = document.createElement('span');
    frame.className = 'blog-image-frame blog-outline-card';
    if (image.classList.contains('desc_img')) frame.classList.add('blog-image-frame--summary');
    image.before(frame);
    frame.append(image);
  }

  function scan(node) {
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    if (node.matches(images)) wrap(node);
    node.querySelectorAll(images).forEach(wrap);
  }

  function start() {
    document.querySelectorAll('#home #cnblogs_post_body, #home .postCon').forEach(region => {
      scan(region);
      new MutationObserver(records => {
        records.forEach(record => record.addedNodes.forEach(scan));
      }).observe(region, { childList: true, subtree: true });
    });
  }

  if (document.querySelector('#home')) start();
  else document.addEventListener('DOMContentLoaded', start, { once: true });
})();

(() => {
  'use strict';
  const fallback = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#718096" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5h14M5 17.5h14"/></svg>');
  // Sites whose declared icon is not at /favicon.ico.
  const known = {
    'github.com': 'https://github.githubassets.com/favicons/favicon.svg',
    'csdiy.wiki': 'https://csdiy.wiki/images/favicon.ico',
    '155tut.github.io': 'https://155tut.github.io/images/155TuT.webp'
  };
  const resolved = new Map();
  const pending = new WeakMap();
  function iconURL(url) {
    if (/(^|\.)cnblogs\.(com|vip)$/.test(url.hostname)) return 'https://assets.cnblogs.com/favicon_v3_3.svg';
    if (url.hostname === 'web.mit.edu' && url.pathname.startsWith('/6.031/www/sp22/')) return 'https://web.mit.edu/6.031/www/sp22/general/icons/6031.ico';
    return known[url.hostname] || 'https://' + url.host + '/favicon.ico';
  }
  function loadOnce(src) {
    if (!resolved.has(src)) resolved.set(src, new Promise(resolve => {
      const probe = new Image();
      let done = false;
      const finish = value => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        probe.onload = probe.onerror = null;
        resolve(value);
      };
      const timer = setTimeout(() => finish(fallback), 5000);
      probe.referrerPolicy = 'no-referrer';
      probe.onload = () => finish(src);
      probe.onerror = () => finish(fallback);
      probe.src = src;
    }));
    return resolved.get(src);
  }
  function activate(anchor) {
    const task = pending.get(anchor);
    if (!task) return;
    pending.delete(anchor);
    loadOnce(task.src).then(src => {
      if (!task.img.isConnected) return;
      task.img.src = src;
      task.img.dataset.faviconState = src === fallback ? 'fallback' : 'loaded';
    });
  }
  const lazy = 'IntersectionObserver' in window ? new IntersectionObserver(entries => {
    for (const entry of entries) if (entry.isIntersecting) {
      lazy.unobserve(entry.target);
      activate(entry.target);
    }
  }, {rootMargin: '300px'}) : null;
  function decorate(anchor) {
    const raw = anchor.getAttribute('href');
    if (raw === null) return;
    let url;
    try { url = new URL(raw, location.href); } catch { return; }
    if (!anchor.closest('#cnblogs_post_body') || !/^https?:$/.test(url.protocol)) return;
    let slot = Array.from(anchor.children).find(el => el.classList.contains('blog-link-favicon-slot'));
    if (slot && slot.dataset.linkHref === raw) return;
    if (slot) slot.remove();
    slot = document.createElement('span');
    slot.className = 'blog-link-favicon-slot';
    slot.dataset.linkHref = raw;
    slot.setAttribute('aria-hidden', 'true');
    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.referrerPolicy = 'no-referrer';
    img.decoding = 'async';
    img.src = fallback;
    img.dataset.faviconState = 'pending';
    slot.append(img);
    anchor.prepend(slot);
    pending.set(anchor, {img, src: iconURL(url)});
    if (lazy) lazy.observe(anchor); else activate(anchor);
  }
  function scan(root) {
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    if (root.matches?.('a[href]')) decorate(root);
    root.querySelectorAll('a[href]').forEach(decorate);
  }
  function start() {
    const content = document.querySelector('#cnblogs_post_body');
    if (!content) return;
    scan(content);
    new MutationObserver(records => {
      for (const record of records) {
        if (record.type === 'attributes') decorate(record.target);
        else {
          if (record.target.matches?.('a[href]')) decorate(record.target);
          record.addedNodes.forEach(scan);
        }
      }
    }).observe(content, {childList: true, subtree: true, attributes: true, attributeFilter: ['href']});
  }
  if (!document.querySelector('#cnblogs_post_body') && document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once: true});
  else start();
})();
</script>
