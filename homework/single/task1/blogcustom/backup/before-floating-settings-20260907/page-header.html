<!-- Generated by scripts/build-footer.mjs; CSS belongs in page-custom.css. -->
<script>
/* Run in page-header.html, before the platform parses the blog containers. */
(() => {
  'use strict';
  const owner = {
    home: 'https://www.cnblogs.com/155TuT/',
    name: '少年漫症候群',
    avatar: 'https://pic.cnblogs.com/face/3847441/20260902151731.png',
    // Optional public URL of your own SVG/PNG/WebP. Empty = inline SVG below.
    searchIconUrl: ''
  };
  const root = document.documentElement;
  root.classList.add('blog-custom-boot');
  const watched = new WeakSet();

  function setText(element, value) {
    if (element.textContent !== value) element.textContent = value;
  }

  function mountHeader() {
    const nav = document.querySelector('#navigator');
    if (!nav) return;
    let left = nav.querySelector('#blog-header-left');
    if (!left) {
      left = document.createElement('div');
      left.id = 'blog-header-left';
      nav.prepend(left);
    }
    const title = document.querySelector('#blogTitle');
    const links = document.querySelector('#navList');
    // Move the original nodes, preserving the title, signature and link handlers.
    if (title && title.parentElement !== left) left.prepend(title);
    if (links && links.parentElement !== left) left.append(links);
  }

  function searchIcon() {
    if (owner.searchIconUrl) {
      const img = document.createElement('img');
      img.src = owner.searchIconUrl;
      img.alt = '';
      img.width = img.height = 20;
      img.className = 'blog-search-icon';
      return img;
    }
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', '20');
    svg.setAttribute('height', '20');
    svg.setAttribute('class', 'blog-search-icon');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', '10.5');
    circle.setAttribute('cy', '10.5');
    circle.setAttribute('r', '6.5');
    const line = document.createElementNS(ns, 'path');
    line.setAttribute('d', 'M15.5 15.5 21 21');
    svg.append(circle, line);
    return svg;
  }

  function mountSearch() {
    const nav = document.querySelector('#navigator');
    if (!nav) return;
    if (!nav.querySelector('#blog-header-search')) {
      const home = new URL(document.querySelector('#blog_nav_myhome')?.href || owner.home);
      const blog = decodeURIComponent(home.pathname.split('/').filter(Boolean)[0]);
      const form = document.createElement('form');
      form.id = 'blog-header-search';
      form.action = 'https://zzkx.cnblogs.com/s';
      form.method = 'get';
      form.setAttribute('role', 'search');
      form.setAttribute('aria-label', '搜索本站文章');
      const input = document.createElement('input');
      input.id = 'blog-search-input';
      input.type = 'search';
      input.placeholder = '搜索本站文章';
      input.setAttribute('aria-label', '搜索本站文章');
      input.required = true;
      const query = document.createElement('input');
      query.type = 'hidden';
      query.name = 'w';
      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'blog-search-submit';
      button.title = '搜索';
      button.setAttribute('aria-label', '搜索');
      button.append(searchIcon());
      form.append(input, button, query);
      form.addEventListener('submit', event => {
        const words = input.value.trim();
        if (!words) {
          event.preventDefault();
          input.focus();
          return;
        }
        query.value = 'blog:' + blog + ' ' + words;
      });
      nav.insertBefore(form, nav.querySelector('.blogStats'));
    }
    // Old footer code or a cached sidebar must not add another search input.
    nav.querySelector('#widget_my_zzk')?.remove();
    document.querySelector('#sidebar_search')?.remove();
  }

  function makeStat(label, key, href) {
    const link = document.createElement('a');
    link.className = 'blog-profile-stat';
    link.dataset.stat = key;
    link.href = href;
    const caption = document.createElement('span');
    caption.className = 'blog-profile-stat-label';
    caption.textContent = label;
    const value = document.createElement('span');
    value.className = 'blog-profile-stat-value';
    value.textContent = '—';
    link.append(caption, value);
    return link;
  }

  function mountProfile() {
    const news = document.querySelector('#sidebar_news');
    const host = document.querySelector('#blog-news');
    if (!news || !host) return;
    let card = document.querySelector('#blog-profile-card');
    if (!card) {
      const home = new URL(owner.home);
      const blog = home.pathname.split('/').filter(Boolean)[0];
      const profile = 'https://home.cnblogs.com/u/' + blog + '/';
      card = document.createElement('section');
      card.id = 'blog-profile-card';
      card.setAttribute('aria-label', '博主资料');
      const avatarLink = document.createElement('a');
      avatarLink.className = 'blog-profile-avatar-link';
      avatarLink.href = profile;
      avatarLink.setAttribute('aria-label', owner.name + '的个人主页');
      const avatar = document.createElement('img');
      avatar.className = 'blog-profile-avatar';
      avatar.src = owner.avatar;
      avatar.alt = '';
      avatar.width = avatar.height = 96;
      avatar.decoding = 'async';
      avatarLink.append(avatar);
      const nickname = document.createElement('a');
      nickname.className = 'blog-profile-name';
      nickname.href = profile;
      nickname.textContent = document.querySelector('#Header1_HeaderTitle')?.textContent.trim() || owner.name;
      const stats = document.createElement('div');
      stats.className = 'blog-profile-stats';
      stats.append(makeStat('粉丝数', 'followers', profile + 'followers/'),
        makeStat('关注数', 'following', profile + 'followees/'));
      card.append(avatarLink, nickname, stats);
      host.append(card);
    }
    news.classList.add('blog-profile-ready');
    const source = document.querySelector('#profile_block');
    const name = source?.querySelector('a');
    if (name) {
      const nickname = card.querySelector('.blog-profile-name');
      nickname.href = name.href;
      setText(nickname, name.textContent.trim());
      card.querySelector('.blog-profile-avatar-link').href = name.href;
    }
    for (const [key, selector] of [['followers', '.follower-count'], ['following', '.folowing-count']]) {
      const original = source?.querySelector(selector);
      if (!original) continue;
      const link = card.querySelector('[data-stat="' + key + '"]');
      link.href = original.href;
      setText(link.querySelector('.blog-profile-stat-value'), original.textContent.trim());
    }
    // Keep the platform's rich announcement and its links as their original nodes.
    // If the async sidebar refreshes, replace the previous announcement in place.
    const announcement = host.querySelector('#sidebar_news_container #sidebar_news_content');
    if (announcement) {
      announcement.classList.add('blog-profile-announcement');
      const previous = card.querySelector('.blog-profile-announcement');
      if (previous) previous.replaceWith(announcement);
      else card.append(announcement);
    }
  }

  function enhance() {
    mountHeader();
    mountSearch();
    mountProfile();
    const sidebar = document.querySelector('#sideBarMain');
    if (sidebar && !watched.has(sidebar)) {
      watched.add(sidebar);
      new MutationObserver(enhance).observe(sidebar, {childList: true, subtree: true, characterData: true});
    }
    if (sidebar && document.querySelector('#navigator')) discovery.disconnect();
  }

  // Observe parsing in microtasks instead of waiting for all scripts/sidebars.
  const discovery = new MutationObserver(enhance);
  discovery.observe(root, {childList: true, subtree: true});
  enhance();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      enhance();
      discovery.disconnect();
      root.classList.remove('blog-custom-boot');
    }, {once: true});
  } else {
    discovery.disconnect();
    root.classList.remove('blog-custom-boot');
  }
})();
</script>
